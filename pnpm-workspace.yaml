packages:
  - "apps/*"
  - "packages/*"
  - "services/*"
  - "tools/*"
  - "e2e"

# pnpm blocks dependency install scripts by default; allow the ones we need.
# The denied ones are a no-op (@google/genai), only check optional CLI deps (protobufjs), or
# belong to Squirrel.Windows, which we don't build (electron-winstaller, via electron-builder).
allowBuilds:
  esbuild: true
  '@google/genai': false
  protobufjs: false
  electron-winstaller: false

# Only install versions published at least a week ago (minutes), so a compromised release has
# time to be caught before it reaches us. Setting it makes pnpm fail instead of falling back.
minimumReleaseAge: 10080
minimumReleaseAgeExclude:
  # Distrusts the compromised eMudhra intermediates (published 2026-10-27); drop after 2026-11-03.
  - electron@44.10.0

# pi pins undici 8.10.2 exactly, which has advisories fixed in 8.12.2 (TLS validation among them).
# Drop this once pi depends on a fixed undici.
overrides:
  'undici@>=8.0.0 <8.12.2': ^8.12.2
