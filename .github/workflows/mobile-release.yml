# Android release: pushing an `android/vX.Y.Z` tag releases independently of desktop's `vX.Y.Z`.
# Builds the Android App Bundle signed with the upload key, checks the signature and keeps the
# .aab as the workflow artifact `android-bundle`. Tagged builds then submit it to Google Play.
# The version is X.Y.Z, and the versionCode X*10000 + Y*100 + Z
# (`apps/mobile/androidApp/build.gradle.kts`). Running it by hand from an `android/v*` tag does the
# same; from a branch it needs the `version` input and builds a test bundle.
#
# Play defaults to an internal draft while the app awaits its first review. Repository variables
# PLAY_TRACK and PLAY_RELEASE_STATUS select the track and draft/completed status after approval.
# Branch dispatches only build; they never upload. Play App Signing re-signs bundles for users.
# The tag is also the source of that release, which the EUPL requires (`Licenses.SOURCE_URL`).
# Setup (upload key, secrets) is in `apps/mobile/README.md`, "Releasing".
name: Phone release

on:
  push:
    tags: ['android/v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'X.Y.Z, when not run from an android/v* tag'
        required: false

permissions:
  contents: read

concurrency:
  group: mobile-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: Check the tag and the secrets
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: version
        name: Read the version from the tag
        env:
          REF_TYPE: ${{ github.ref_type }}
          TAG: ${{ github.ref_name }}
          INPUT: ${{ inputs.version }}
        run: |
          if [[ "$REF_TYPE" == tag ]]; then
            if [[ ! "$TAG" =~ ^android/v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::Tag $TAG is not android/vX.Y.Z"
              exit 1
            fi
            version=${TAG#android/v}
            if [[ -n "$INPUT" && "$INPUT" != "$version" ]]; then
              echo "::error::Version input does not match tag $TAG"
              exit 1
            fi
          else
            version=$INPUT
          fi
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::No version: run this from an android/vX.Y.Z tag, or give X.Y.Z as the version input"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Check the commit is on master
        if: github.ref_type == 'tag'
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/master 2>/dev/null; then
            echo "::error::$GITHUB_REF_NAME points to a commit that is not on master"
            exit 1
          fi
      - name: Check the signing secrets
        env:
          SA_UPLOAD_KEYSTORE_BASE64: ${{ secrets.SA_UPLOAD_KEYSTORE_BASE64 }}
          SA_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.SA_UPLOAD_KEYSTORE_PASSWORD }}
          SA_UPLOAD_KEY_ALIAS: ${{ secrets.SA_UPLOAD_KEY_ALIAS }}
          SA_UPLOAD_KEY_PASSWORD: ${{ secrets.SA_UPLOAD_KEY_PASSWORD }}
        run: |
          missing=()
          for name in SA_UPLOAD_KEYSTORE_BASE64 SA_UPLOAD_KEYSTORE_PASSWORD SA_UPLOAD_KEY_ALIAS SA_UPLOAD_KEY_PASSWORD; do
            [[ -n "${!name}" ]] || missing+=("$name")
          done
          if (( ${#missing[@]} )); then
            echo "::error::Missing repository secrets: ${missing[*]} (apps/mobile/README.md, \"Releasing\")"
            exit 1
          fi

  bundle:
    name: Build the signed bundle
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v5
      # Gradle picks JDK 17 (gradle/gradle-daemon-jvm.properties) from JAVA_HOME_17_X64.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      # Reads the caches the CI workflow saves on master, and saves none.
      - uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: true
      # The runner's Android SDK (ANDROID_HOME) lacks the compile SDK.
      - name: Install Android platform 37
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-37.0' > /dev/null
      - name: Write the upload keystore
        env:
          SA_UPLOAD_KEYSTORE_BASE64: ${{ secrets.SA_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$SA_UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.jks"
          echo "SA_UPLOAD_KEYSTORE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
      - name: Build the bundle
        env:
          SA_APP_VERSION: ${{ needs.check.outputs.version }}
          SA_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.SA_UPLOAD_KEYSTORE_PASSWORD }}
          SA_UPLOAD_KEY_ALIAS: ${{ secrets.SA_UPLOAD_KEY_ALIAS }}
          SA_UPLOAD_KEY_PASSWORD: ${{ secrets.SA_UPLOAD_KEY_PASSWORD }}
        run: ./gradlew --console=plain :androidApp:bundleRelease
      # jarsigner prints "jar is unsigned." and still exits 0, so look for "jar verified.".
      # The certificate is the upload key's: it must match the one registered in Play Console.
      - name: Check the signature
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          aab=androidApp/build/outputs/bundle/release/androidApp-release.aab
          out=$(jarsigner -verify "$aab")
          echo "$out"
          if ! grep -qx 'jar verified.' <<< "$out"; then
            echo "::error::$aab is not signed"
            exit 1
          fi
          keytool -printcert -jarfile "$aab" | grep -E 'Owner|SHA256:'
          mv "$aab" "SpainAssist-$VERSION.aab"
          cp androidApp/build/outputs/mapping/release/mapping.txt mapping.txt
          # AGP's packaged-manifest metadata has the actual versionCode, including overrides.
          cp androidApp/build/intermediates/packaged_manifests/release/processReleaseManifestForPackage/output-metadata.json version.json
      - name: Remove the keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"
      - uses: actions/upload-artifact@v4
        with:
          name: android-bundle
          path: |
            apps/mobile/SpainAssist-*.aab
            apps/mobile/mapping.txt
            apps/mobile/version.json
          if-no-files-found: error
          # Keep the bundle and mapping for diagnosis or manual recovery.
          retention-days: 30

  play:
    name: Submit to Google Play
    needs: bundle
    # A branch dispatch builds a test bundle; only immutable release tags reach Play.
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    # Play edits invalidate each other, even when their tags differ.
    concurrency:
      group: android-play
      cancel-in-progress: false
    env:
      PLAY_TRACK: ${{ vars.PLAY_TRACK || 'internal' }}
      PLAY_RELEASE_STATUS: ${{ vars.PLAY_RELEASE_STATUS || 'draft' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false
      - name: Check Play configuration
        env:
          WORKLOAD_IDENTITY_PROVIDER: ${{ vars.PLAY_WORKLOAD_IDENTITY_PROVIDER }}
          SERVICE_ACCOUNT: ${{ vars.PLAY_SERVICE_ACCOUNT }}
        run: |
          if [[ -z "$WORKLOAD_IDENTITY_PROVIDER" || -z "$SERVICE_ACCOUNT" ]]; then
            echo "::error::Missing PLAY_WORKLOAD_IDENTITY_PROVIDER or PLAY_SERVICE_ACCOUNT: see apps/mobile/README.md, Releasing. The signed android-bundle artifact is available for manual upload."
            exit 1
          fi
          case "$PLAY_RELEASE_STATUS" in
            draft|completed) ;;
            *) echo "::error::PLAY_RELEASE_STATUS must be draft or completed"; exit 1 ;;
          esac
      - uses: actions/download-artifact@v5
        with:
          name: android-bundle
          path: ${{ runner.temp }}/android-bundle
      - id: auth
        name: Authenticate with GitHub identity
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.PLAY_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.PLAY_SERVICE_ACCOUNT }}
          export_environment_variables: false
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/androidpublisher
      # Read the track before uploading: skip a saved version, or resume using its existing bundle.
      # The short-lived token uses identity federation; no service-account key is stored.
      - name: Submit the Android version unless already saved in Play
        env:
          PLAY_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          ANDROID_BUNDLE_DIR: ${{ runner.temp }}/android-bundle
        run: node scripts/store-submissions.mjs android
