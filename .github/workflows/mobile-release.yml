# Phone app release: called by release.yml for stable vX.Y.Z tags, or by a mobile-vX.Y.Z tag.
# Builds the Android App Bundle signed with the upload key, checks the signature and keeps the
# .aab as the workflow artifact `android-bundle`. Tagged builds then submit it to Google Play.
# The version is X.Y.Z, and the versionCode X*10000 + Y*100 + Z
# (`apps/mobile/androidApp/build.gradle.kts`). Running it by hand from a `mobile-v*` tag does the
# same; from a branch it needs the `version` input and builds a test bundle.
#
# Play defaults to an internal draft while the app awaits its first review. Repository variables
# PLAY_TRACK and PLAY_RELEASE_STATUS select the track and draft/completed status after approval.
# Branch dispatches only build; they never upload. Play App Signing re-signs bundles for users.
# The tag is also the source of that release, which the EUPL requires (`Licenses.SOURCE_URL`).
# Setup (upload key, secrets) is in `apps/mobile/README.md`, "Releasing".
name: Phone release

on:
  workflow_call:
    inputs:
      version:
        description: Stable X.Y.Z from the release tag
        required: true
        type: string
  push:
    tags: ['mobile-v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'X.Y.Z, when not run from a mobile-v* tag'
        required: false

permissions:
  contents: read

concurrency:
  group: mobile-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: Check the tag and the secrets
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: version
        name: Read the version from the tag
        env:
          REF_TYPE: ${{ github.ref_type }}
          TAG: ${{ github.ref_name }}
          INPUT: ${{ inputs.version }}
        run: |
          if [[ "$REF_TYPE" == tag ]]; then
            if [[ ! "$TAG" =~ ^(mobile-)?v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::Tag $TAG is not vX.Y.Z or mobile-vX.Y.Z"
              exit 1
            fi
            version=${TAG#mobile-}
            version=${version#v}
            if [[ -n "$INPUT" && "$INPUT" != "$version" ]]; then
              echo "::error::Version input does not match tag $TAG"
              exit 1
            fi
          else
            version=$INPUT
          fi
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::No version: run this from a mobile-vX.Y.Z tag, or give X.Y.Z as the version input"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Check the commit is on master
        if: github.ref_type == 'tag'
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/master 2>/dev/null; then
            echo "::error::$GITHUB_REF_NAME points to a commit that is not on master"
            exit 1
          fi
      - name: Check the signing secrets
        env:
          SA_UPLOAD_KEYSTORE_BASE64: ${{ secrets.SA_UPLOAD_KEYSTORE_BASE64 }}
          SA_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.SA_UPLOAD_KEYSTORE_PASSWORD }}
          SA_UPLOAD_KEY_ALIAS: ${{ secrets.SA_UPLOAD_KEY_ALIAS }}
          SA_UPLOAD_KEY_PASSWORD: ${{ secrets.SA_UPLOAD_KEY_PASSWORD }}
        run: |
          missing=()
          for name in SA_UPLOAD_KEYSTORE_BASE64 SA_UPLOAD_KEYSTORE_PASSWORD SA_UPLOAD_KEY_ALIAS SA_UPLOAD_KEY_PASSWORD; do
            [[ -n "${!name}" ]] || missing+=("$name")
          done
          if (( ${#missing[@]} )); then
            echo "::error::Missing repository secrets: ${missing[*]} (apps/mobile/README.md, \"Releasing\")"
            exit 1
          fi

  bundle:
    name: Build the signed bundle
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v5
      # Gradle picks JDK 17 (gradle/gradle-daemon-jvm.properties) from JAVA_HOME_17_X64.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      # Reads the caches the CI workflow saves on master, and saves none.
      - uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: true
      # The runner's Android SDK (ANDROID_HOME) lacks the compile SDK.
      - name: Install Android platform 37
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-37.0' > /dev/null
      - name: Write the upload keystore
        env:
          SA_UPLOAD_KEYSTORE_BASE64: ${{ secrets.SA_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$SA_UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.jks"
          echo "SA_UPLOAD_KEYSTORE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
      - name: Build the bundle
        env:
          SA_APP_VERSION: ${{ needs.check.outputs.version }}
          SA_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.SA_UPLOAD_KEYSTORE_PASSWORD }}
          SA_UPLOAD_KEY_ALIAS: ${{ secrets.SA_UPLOAD_KEY_ALIAS }}
          SA_UPLOAD_KEY_PASSWORD: ${{ secrets.SA_UPLOAD_KEY_PASSWORD }}
        run: ./gradlew --console=plain :androidApp:bundleRelease
      # jarsigner prints "jar is unsigned." and still exits 0, so look for "jar verified.".
      # The certificate is the upload key's: it must match the one registered in Play Console.
      - name: Check the signature
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          aab=androidApp/build/outputs/bundle/release/androidApp-release.aab
          out=$(jarsigner -verify "$aab")
          echo "$out"
          if ! grep -qx 'jar verified.' <<< "$out"; then
            echo "::error::$aab is not signed"
            exit 1
          fi
          keytool -printcert -jarfile "$aab" | grep -E 'Owner|SHA256:'
          mv "$aab" "SpainAssist-$VERSION.aab"
          cp androidApp/build/outputs/mapping/release/mapping.txt mapping.txt
      - name: Remove the keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"
      - uses: actions/upload-artifact@v4
        with:
          name: android-bundle
          path: |
            apps/mobile/SpainAssist-*.aab
            apps/mobile/mapping.txt
          if-no-files-found: error
          # Keep the bundle and mapping for diagnosis or manual recovery.
          retention-days: 30

  play:
    name: Submit to Google Play
    needs: bundle
    # A branch dispatch builds a test bundle; only immutable release tags reach Play.
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Play edits invalidate each other, even when their tags differ.
    concurrency:
      group: android-play
      cancel-in-progress: false
    env:
      PLAY_TRACK: ${{ vars.PLAY_TRACK || 'internal' }}
      PLAY_RELEASE_STATUS: ${{ vars.PLAY_RELEASE_STATUS || 'draft' }}
    steps:
      - name: Check Play configuration
        env:
          SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [[ -z "$SERVICE_ACCOUNT_JSON" ]]; then
            echo "::error::Missing PLAY_SERVICE_ACCOUNT_JSON: see apps/mobile/README.md, Releasing. The signed android-bundle artifact is available for manual upload."
            exit 1
          fi
          case "$PLAY_RELEASE_STATUS" in
            draft|completed) ;;
            *) echo "::error::PLAY_RELEASE_STATUS must be draft or completed"; exit 1 ;;
          esac
      - uses: actions/download-artifact@v5
        with:
          name: android-bundle
          path: ${{ runner.temp }}/android-bundle
      # Pin the action that receives the Play credential; v1 uses Node 24.
      - name: Upload the bundle and mapping
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: es.spainassist.firma
          releaseFiles: ${{ runner.temp }}/android-bundle/SpainAssist-*.aab
          mappingFile: ${{ runner.temp }}/android-bundle/mapping.txt
          track: ${{ env.PLAY_TRACK }}
          status: ${{ env.PLAY_RELEASE_STATUS }}
          changesNotSentForReview: ${{ env.PLAY_RELEASE_STATUS == 'draft' }}
      - name: Record the Play submission
        run: |
          {
            echo "### Google Play"
            echo "Uploaded es.spainassist.firma to **$PLAY_TRACK** with status **$PLAY_RELEASE_STATUS**."
            if [[ "$PLAY_RELEASE_STATUS" == draft ]]; then
              echo "The bundle is saved in Play Console. Complete the app setup and send it for review there."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
