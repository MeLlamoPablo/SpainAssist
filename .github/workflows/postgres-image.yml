# Production's Postgres image: the official Alpine image plus pgvector, which the feedback
# server's hybrid search needs (infra/postgres/Dockerfile). Every change to it is built and
# checked (the extension loads and a database's owner can create it); on master the image is
# also published to GitHub's registry, where Coolify pulls it from.
#
# Production pins the image by digest (infra/terraform/coolify.tf): this workflow prints the
# digest in its summary, and nothing changes there until someone pins it and restarts Postgres
# (infra/README.md, "Hybrid search").
name: Postgres image

on:
  push:
    branches: [master]
    paths:
      - infra/postgres/Dockerfile
      - infra/postgres/smoke-test.sh
      - .github/workflows/postgres-image.yml
  pull_request:
    paths:
      - infra/postgres/Dockerfile
      - infra/postgres/smoke-test.sh
      - .github/workflows/postgres-image.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: postgres-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    name: Build, check and publish
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # ghcr.io/<owner>/<repository>-postgres:<postgres version>-pgvector<pgvector version>
      - id: name
        name: Name the image
        run: |
          postgres=$(sed -n 's/^ARG POSTGRES_IMAGE=postgres:\([0-9.]*\)-alpine@.*/\1/p' infra/postgres/Dockerfile)
          pgvector=$(sed -n 's/^ARG PGVECTOR_VERSION=\([0-9.]*\)$/\1/p' infra/postgres/Dockerfile)
          test -n "$postgres" && test -n "$pgvector"
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}-postgres:$postgres-pgvector$pgvector" >> "$GITHUB_OUTPUT"

      - name: Build
        run: docker build -t "${{ steps.name.outputs.image }}" infra/postgres

      - name: Check that pgvector works
        run: infra/postgres/smoke-test.sh "${{ steps.name.outputs.image }}"

      - name: Publish
        if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker push "${{ steps.name.outputs.image }}"
          digest=$(docker inspect --format '{{index .RepoDigests 0}}' "${{ steps.name.outputs.image }}")
          {
            echo "Published \`${{ steps.name.outputs.image }}\`. To use it in production, pin:"
            echo
            echo "    ${{ steps.name.outputs.image }}@${digest#*@}"
          } >> "$GITHUB_STEP_SUMMARY"
