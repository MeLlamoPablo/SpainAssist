# Desktop release: pushing a tag `vX.Y.Z` (or `vX.Y.Z-suffix`, a prerelease) on a
# commit of `master` builds the installers on one native runner per target and publishes
# them as a GitHub Release, with SHA256SUMS.txt. Two gates come first and last:
# - `ci`: nothing is built until CI (ci.yml) passed for the tagged commit. It waits for a run in
#   progress, and starts one on the tag when the commit has none (scripts/ci-gate.mjs). A failed
#   CI stops the release: re-run CI's failed jobs, then this run's.
# - Each build runner installs what it built as a user would (the NSIS installer silently, the
#   .deb with apt, the signed macOS app) and runs the app's `--self-test`
#   (apps/desktop/src/main/app/self-test.ts): the bundled Chromium must start headed and keep
#   running with a CRLSet, and sa-sidecar must proxy. A failing self-test fails its build job, so
#   neither the GitHub release nor the Microsoft Store submission happens. The Store's MSIX
#   isn't self-tested: it would need a sideloading certificate, Add-AppxPackage and an app
#   execution alias to pass arguments (docs/ARCHITECTURE.md, "Shipping"). Windows also uploads `latest.yml` and the
# installer's blockmap, macOS `latest-mac.yml` and the zips' blockmaps, and Linux
# `latest-linux.yml`: installed Windows and macOS apps and .deb installs update from them
# (electron-updater). Linux ships only the .deb: no AppImage, snap or apt
# repository. Installer names carry no version (`SpainAssist-mac-arm64.dmg`), so
# `releases/latest/download/<name>` links always reach the newest stable release.
# Publishing a tag that already has a release deletes that release first, so moving the tag
# (`git tag -f vX.Y.Z && git push -f origin vX.Y.Z`) or re-running the workflow republishes it.
#
# Windows also builds the Microsoft Store MSIX (`SpainAssist-win-x64.msix`) in the same run. It
# isn't part of the release: it is the workflow artifact `store-msix`. After a stable tag's release,
# the `store` job submits it to Partner Center (store.yml, which can also resubmit a run's MSIX by
# hand). Prereleases are never submitted: the Store needs a higher version each
# time, and `vX.Y.Z-suffix` builds as X.Y.Z.0 too. A prerelease's MSIX is for sideload testing
# (signed locally with a certificate for the `appx.publisher` subject). The Store signs the package
# it ships.
#
# macOS builds are signed with the Developer ID Application certificate and notarized, from the
# Actions secrets `infra/terraform/github_release.tf` sets (CSC_LINK, CSC_KEY_PASSWORD,
# APPLE_API_KEY_P8, APPLE_API_KEY_ID, APPLE_API_ISSUER): without them the macOS builds fail rather
# than ship unsigned, because signed apps update themselves and Squirrel.Mac only installs updates
# signed by the same Developer ID. Each CPU goes through four jobs, each from the previous one's
# artifact, so a failed or stalled notarization is re-run on its own ("Re-run failed jobs") without
# rebuilding or resigning anything:
#   build-mac (sign the .app) -> notarize-app -> package-mac (dmg + zip, signed dmg) -> notarize-dmg
# The notarize jobs (.github/actions/notarize) staple a ticket Apple already issued for the same
# bytes before they submit anything. Each CPU writes a `latest-mac.yml`; the release merges them
# into one that lists both zips (electron-updater picks the one for the Mac).
# Windows builds are unsigned for now: signing turns on when its secrets are passed as the
# environment variables `apps/desktop/electron-builder.ts` reads. Linux has no code signing:
# SHA256SUMS.txt covers the .deb.
# Android releases independently from `android/vX.Y.Z` tags through mobile-release.yml.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'

jobs:
  check:
    name: Check the tag
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: version
        name: Read the version from the tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag $TAG is not vX.Y.Z or vX.Y.Z-suffix"
            exit 1
          fi
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          [[ "$TAG" == *-* ]] && prerelease=true || prerelease=false
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
      - name: Check the commit is on master
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/master 2>/dev/null; then
            echo "::error::$GITHUB_REF_NAME points to a commit that is not on master"
            exit 1
          fi

  ci:
    name: CI passed for the commit
    needs: check
    runs-on: ubuntu-24.04
    # CI takes about half an hour; a queued Windows or macOS runner can add to that.
    timeout-minutes: 110
    permissions:
      # Reads CI's runs, and starts one when the commit has none.
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
          package-manager-cache: false
      - name: Wait for CI's verdict
        env:
          GH_TOKEN: ${{ github.token }}
        run: COMMIT=$(git rev-parse HEAD) node scripts/ci-gate.mjs

  build:
    name: Build ${{ matrix.name }}
    needs: [check, ci]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            runner: windows-2025
            script: package:win
          - name: Linux x64
            runner: ubuntu-24.04
            script: package:linux
    runs-on: ${{ matrix.runner }}
    steps:
      # The same bytes as CI tested: Git for Windows would check text files out with CRLF, which
      # then ship in the app (`?raw` imports, the models file).
      - name: Check out with LF line endings
        shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - name: Set the app version from the tag
        working-directory: apps/desktop
        run: npm pkg set version=${{ needs.check.outputs.version }}
      - name: Package
        env:
          # Never pick up an identity from a runner's certificate store.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: corepack pnpm --filter @sa/desktop run ${{ matrix.script }}
      # The one-click installer as users run it, silently: per user, into %LOCALAPPDATA%\Programs,
      # without starting the app. MSYS_NO_PATHCONV keeps Git Bash from turning /S into a path.
      - name: Install and self-test (Windows)
        if: runner.os == 'Windows'
        shell: bash
        timeout-minutes: 10
        run: |
          installers=(apps/desktop/dist/SpainAssist-win-*.exe)
          MSYS_NO_PATHCONV=1 "${installers[0]}" /S
          programs=$(cygpath -u "$LOCALAPPDATA")/Programs
          for _ in $(seq 60); do
            exe=$(find "$programs" -maxdepth 2 -name 'Spain Assist.exe' | head -1)
            [[ -n "$exe" ]] && break
            sleep 1
          done
          echo "Installed: $exe"
          "$exe" --self-test | tee "$RUNNER_TEMP/self-test.json"
      # apt runs the .deb's after-install script, which sets up chrome-sandbox and, on Ubuntu
      # 24.04, the AppArmor profile the app's sandbox needs: the self-test runs the app with them
      # (unlike ci.yml's e2e job, which lifts the AppArmor restriction instead).
      - name: Install and self-test (Linux)
        if: runner.os == 'Linux'
        shell: bash
        timeout-minutes: 10
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb ./apps/desktop/dist/*.deb
          xvfb-run --auto-servernum spain-assist --self-test | tee "$RUNNER_TEMP/self-test.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installers-${{ runner.os }}-${{ runner.arch }}
          path: |
            apps/desktop/dist/*.exe
            apps/desktop/dist/*.exe.blockmap
            apps/desktop/dist/latest.yml
            apps/desktop/dist/*.deb
            apps/desktop/dist/latest-linux.yml
          if-no-files-found: error
          retention-days: 7
      - if: runner.os == 'Windows'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: store-msix
          path: apps/desktop/dist/*.msix
          if-no-files-found: error
          # Long enough to upload to Partner Center after a release.
          retention-days: 30

  build-mac:
    name: Build macOS ${{ matrix.arch }}
    needs: [check, ci]
    strategy:
      fail-fast: false
      matrix:
        include:
          # arm64 on macOS 26: on macos-15, Xcode 26's actool crashed compiling the Icon
          # Composer icon ("The tool closed the connection (AssetCatalogAgent-AssetRuntime)") in
          # two of v0.3.0's three attempts. There is no Intel macOS 26 image; macos-15-intel
          # compiled it every time.
          - arch: arm64
            runner: macos-26
          - arch: x64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - name: Set the app version from the tag
        working-directory: apps/desktop
        run: npm pkg set version=${{ needs.check.outputs.version }}
      # The app icon is an Icon Composer bundle (packaging/icon.icon): only Xcode 26's actool
      # compiles it, and the macOS 15 images select an older Xcode by default.
      - name: Select Xcode 26
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)"
          xcodebuild -version
      - name: Check the signing secrets
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
        run: |
          if [[ -z "$CSC_LINK" ]]; then
            echo "::error::The macOS signing secrets are missing: apply infra/terraform (github_release.tf)"
            exit 1
          fi
      - name: Build and sign the app
        env:
          # electron-builder 26 only finds the identity in CSC_LINK with auto-discovery on (or
          # CSC_NAME); it then searches only the temporary keychain it imports CSC_LINK into,
          # never the runner's.
          CSC_IDENTITY_AUTO_DISCOVERY: 'true'
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: corepack pnpm --filter @sa/desktop run package:mac:app
      # The signed app, hardened runtime and all (notarizing changes none of its code), before
      # any time goes into notarizing it.
      - name: Self-test
        # Explicitly bash: `-o pipefail`, so the app's exit code survives `tee`.
        shell: bash
        timeout-minutes: 10
        run: |
          apps=(apps/desktop/dist/mac*/"Spain Assist.app")
          "${apps[0]}/Contents/MacOS/Spain Assist" --self-test | tee "$RUNNER_TEMP/self-test.json"
      # ditto keeps the bundle's symlinks, permissions and extended attributes; an artifact of the
      # bare folder would lose them and break the signature.
      - name: Pack the signed app
        working-directory: apps/desktop/dist
        run: ditto -c -k --sequesterRsrc --keepParent mac*/"Spain Assist.app" signed-app.zip
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mac-app-signed-${{ matrix.arch }}
          path: apps/desktop/dist/signed-app.zip
          if-no-files-found: error
          # Already compressed.
          compression-level: 0
          retention-days: 7

  notarize-app:
    name: Notarize the macOS ${{ matrix.arch }} app
    needs: build-mac
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x64]
    runs-on: macos-15
    # notarize.sh waits up to 30 min for Apple; a re-run picks up a late ticket.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mac-app-signed-${{ matrix.arch }}
          path: ${{ runner.temp }}/signed
      - name: Unpack the signed app
        run: ditto -x -k "$RUNNER_TEMP/signed/signed-app.zip" "$RUNNER_TEMP/app"
      - uses: ./.github/actions/notarize
        with:
          path: ${{ runner.temp }}/app/Spain Assist.app
          name: SpainAssist-mac-${{ matrix.arch }}.app.zip
          api-key: ${{ secrets.APPLE_API_KEY_P8 }}
          api-key-id: ${{ secrets.APPLE_API_KEY_ID }}
          api-issuer: ${{ secrets.APPLE_API_ISSUER }}
      - name: Pack the notarized app
        working-directory: ${{ runner.temp }}/app
        run: ditto -c -k --sequesterRsrc --keepParent "Spain Assist.app" "$RUNNER_TEMP/notarized-app.zip"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mac-app-notarized-${{ matrix.arch }}
          path: ${{ runner.temp }}/notarized-app.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  package-mac:
    name: Package macOS ${{ matrix.arch }}
    needs: [check, notarize-app]
    strategy:
      fail-fast: false
      matrix:
        include:
          # The same runners as build-mac (see there why arm64 is on macOS 26).
          - arch: arm64
            runner: macos-26
          - arch: x64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - name: Set the app version from the tag
        working-directory: apps/desktop
        run: npm pkg set version=${{ needs.check.outputs.version }}
      # The dmg's volume icon is compiled from packaging/icon.icon too (see build-mac).
      - name: Select Xcode 26
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)"
          xcodebuild -version
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mac-app-notarized-${{ matrix.arch }}
          path: ${{ runner.temp }}/notarized
      - name: Unpack the notarized app
        run: ditto -x -k "$RUNNER_TEMP/notarized/notarized-app.zip" "$RUNNER_TEMP/app"
      # --prepackaged only builds the dmg and zip from the stapled app: no pack, no re-signing
      # (its signature and ticket stay as notarized). The dmg is signed here and notarized next;
      # a signed dmg that isn't notarized is worse than an unsigned one, so never ship it alone.
      - name: Build the dmg and zip
        working-directory: apps/desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'true'
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          ARCH: ${{ matrix.arch }}
        # Signing the dmg asks Apple's timestamp server, which can drop a request ("A timestamp was
        # expected but was not found", seen on a runner): try three times. Each try is a clean build.
        run: |
          for attempt in 1 2 3; do
            rm -rf dist
            corepack pnpm exec electron-builder --mac dmg zip "--$ARCH" \
              --prepackaged "$RUNNER_TEMP/app/Spain Assist.app" \
              -c.mac.notarize=false -c.dmg.sign=true --publish never && break
            [[ $attempt == 3 ]] && exit 1
            echo "::warning::Building the dmg failed (attempt $attempt), retrying"
            sleep 30
          done
          mv dist/latest-mac.yml "dist/latest-mac-$ARCH.yml"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mac-dist-${{ matrix.arch }}
          path: |
            apps/desktop/dist/*.dmg
            apps/desktop/dist/*.zip
            apps/desktop/dist/*.zip.blockmap
            apps/desktop/dist/latest-mac-*.yml
          if-no-files-found: error
          retention-days: 7

  notarize-dmg:
    name: Notarize the macOS ${{ matrix.arch }} dmg
    needs: package-mac
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x64]
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mac-dist-${{ matrix.arch }}
          path: ${{ runner.temp }}/installers
      - uses: ./.github/actions/notarize
        with:
          path: ${{ runner.temp }}/installers/SpainAssist-mac-${{ matrix.arch }}.dmg
          name: SpainAssist-mac-${{ matrix.arch }}.dmg
          api-key: ${{ secrets.APPLE_API_KEY_P8 }}
          api-key-id: ${{ secrets.APPLE_API_KEY_ID }}
          api-issuer: ${{ secrets.APPLE_API_ISSUER }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installers-macOS-${{ matrix.arch }}
          path: ${{ runner.temp }}/installers/*
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish the release
    needs: [check, build, notarize-dmg]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: installers-*
          path: installers
          merge-multiple: true
      # electron-updater on a Mac reads one `latest-mac.yml`, and picks the arm64 or x64 zip in it.
      # Stapling changed each dmg after electron-builder hashed it: hash every listed file again.
      - name: Merge the macOS update files
        working-directory: installers
        run: |
          yq '.files += load("latest-mac-arm64.yml").files' latest-mac-x64.yml > latest-mac.yml
          rm latest-mac-arm64.yml latest-mac-x64.yml
          for url in $(yq '.files[].url' latest-mac.yml); do
            export URL=$url
            export SHA=$(openssl dgst -sha512 -binary "$url" | base64 -w0)
            export SIZE=$(stat -c %s "$url")
            yq -i '(.files[] | select(.url == strenv(URL))) |= (.sha512 = strenv(SHA) | .size = env(SIZE))' latest-mac.yml
          done
          cat latest-mac.yml
      - name: Write checksums
        working-directory: installers
        run: sha256sum -- * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.check.outputs.version }}
          PRERELEASE: ${{ needs.check.outputs.prerelease }}
        run: |
          # Re-running a tag (re-pushed or re-run) replaces its release; the tag itself stays.
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release delete "$TAG" --yes
          fi
          flags=()
          [[ "$PRERELEASE" == true ]] && flags+=(--prerelease)
          gh release create "$TAG" installers/* \
            --verify-tag --notes "" --title "Spain Assist $VERSION" "${flags[@]}"

  store:
    name: Microsoft Store
    needs: [check, build, release]
    # Only stable tags: a prerelease builds as X.Y.Z.0 too, and the Store needs a higher version
    # each time.
    if: needs.check.outputs.prerelease == 'false'
    uses: ./.github/workflows/store.yml
    permissions:
      actions: read
      contents: read
    secrets: inherit
