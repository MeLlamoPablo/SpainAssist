# Desktop release: pushing a tag `vX.Y.Z` (or `vX.Y.Z-suffix`, a prerelease) on a
# commit of `master` builds the installers on one native runner per target and publishes
# them as a GitHub Release, with SHA256SUMS.txt. Windows also uploads `latest.yml` and the
# installer's blockmap, macOS `latest-mac.yml` and the zips' blockmaps, and Linux
# `latest-linux.yml`: installed Windows and macOS apps and .deb installs update from them
# (electron-updater). Linux ships only the .deb: no AppImage, snap or apt
# repository. Installer names carry no version (`SpainAssist-mac-arm64.dmg`), so
# `releases/latest/download/<name>` links always reach the newest stable release.
# Publishing a tag that already has a release deletes that release first, so moving the tag
# (`git tag -f vX.Y.Z && git push -f origin vX.Y.Z`) or re-running the workflow republishes it.
#
# Windows also builds the Microsoft Store MSIX (`SpainAssist-win-x64.msix`) in the same run. It
# isn't part of the release: it is the workflow artifact `store-msix`, which is uploaded to Partner
# Center by hand (Apps and games > Spain Assist > new submission > Packages). Submit only stable
# tags: the Store needs a higher version each time, and `vX.Y.Z-suffix` builds as X.Y.Z.0 too.
# A prerelease's MSIX is for sideload testing (signed locally with a certificate for the
# `appx.publisher` subject). The Store signs the package it ships.
#
# macOS builds are signed with the Developer ID Application certificate and notarized, from the
# Actions secrets `infra/terraform/github_release.tf` sets (CSC_LINK, CSC_KEY_PASSWORD,
# APPLE_API_KEY_P8, APPLE_API_KEY_ID, APPLE_API_ISSUER): without them the macOS builds fail rather
# than ship unsigned, because signed apps update themselves and Squirrel.Mac only installs updates
# signed by the same Developer ID. Each macOS runner writes a `latest-mac.yml` for its own CPU; the
# release merges them into one that lists both zips (electron-updater picks the one for the Mac).
# Windows builds are unsigned for now: signing turns on when its secrets are passed as the
# environment variables `apps/desktop/electron-builder.ts` reads. Linux has no code signing:
# SHA256SUMS.txt covers the .deb.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'

jobs:
  check:
    name: Check the tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: version
        name: Read the version from the tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag $TAG is not vX.Y.Z or vX.Y.Z-suffix"
            exit 1
          fi
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          [[ "$TAG" == *-* ]] && prerelease=true || prerelease=false
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
      - name: Check the commit is on master
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/master 2>/dev/null; then
            echo "::error::$GITHUB_REF_NAME points to a commit that is not on master"
            exit 1
          fi

  build:
    name: Build ${{ matrix.name }}
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            runner: macos-15
            script: package:mac
          - name: macOS x64
            runner: macos-15-intel
            script: package:mac
          - name: Windows x64
            runner: windows-2025
            script: package:win
          - name: Linux x64
            runner: ubuntu-24.04
            script: package:linux
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          # It would look for pnpm before Corepack is set up; the pnpm store is cached below.
          package-manager-cache: false
      - uses: actions/setup-go@v6
        with:
          go-version: stable
          cache: false
      # pnpm 12 needs Corepack 0.36 or later; the package scripts call `corepack pnpm` too.
      # --force: Windows runners have a global Yarn whose shims Corepack's replace. There npm's
      # global prefix comes after Node's bundled (older) Corepack on PATH, so put it first.
      - name: Install Corepack
        shell: bash
        run: |
          npm install --global --force corepack@latest
          prefix=$(npm prefix --global)
          if [[ "$RUNNER_OS" == Windows ]]; then echo "$prefix"; else echo "$prefix/bin"; fi >> "$GITHUB_PATH"
      - name: Check Corepack
        shell: bash
        run: |
          command -v corepack
          corepack --version
      - id: pnpm-store
        name: Find the pnpm store
        shell: bash
        run: echo "path=$(corepack pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-${{ runner.arch }}-
      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile
      - name: Set the app version from the tag
        working-directory: apps/desktop
        run: npm pkg set version=${{ needs.check.outputs.version }}
      # notarytool takes the API key as a file (docs/research/electron-packaging.md §6.6).
      - if: runner.os == 'macOS'
        name: Write the notarization key
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
        run: |
          if [[ -z "$CSC_LINK" || -z "$APPLE_API_KEY_P8" ]]; then
            echo "::error::The macOS signing secrets are missing: apply infra/terraform (github_release.tf)"
            exit 1
          fi
          key="$RUNNER_TEMP/AuthKey.p8"
          printf '%s\n' "$APPLE_API_KEY_P8" > "$key"
          echo "APPLE_API_KEY=$key" >> "$GITHUB_ENV"
      - name: Package
        env:
          # electron-builder 26 only finds the identity in CSC_LINK with auto-discovery on (or
          # CSC_NAME); it then searches only the temporary keychain it imports CSC_LINK into,
          # never the runner's. Off elsewhere: no identity from a runner's keychain.
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ runner.os == 'macOS' }}
          # macOS only: Windows would take CSC_LINK as its own certificate.
          CSC_LINK: ${{ runner.os == 'macOS' && secrets.CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ runner.os == 'macOS' && secrets.CSC_KEY_PASSWORD || '' }}
          APPLE_API_KEY_ID: ${{ runner.os == 'macOS' && secrets.APPLE_API_KEY_ID || '' }}
          APPLE_API_ISSUER: ${{ runner.os == 'macOS' && secrets.APPLE_API_ISSUER || '' }}
        run: corepack pnpm --filter @sa/desktop run ${{ matrix.script }}
      # Both macOS runners write `latest-mac.yml`: keep them apart until the release merges them.
      - if: runner.os == 'macOS'
        name: Name the update file after the CPU
        working-directory: apps/desktop/dist
        run: mv latest-mac.yml "latest-mac-$(uname -m).yml"
      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ runner.os }}-${{ runner.arch }}
          path: |
            apps/desktop/dist/*.dmg
            apps/desktop/dist/*.zip
            apps/desktop/dist/*.zip.blockmap
            apps/desktop/dist/latest-mac-*.yml
            apps/desktop/dist/*.exe
            apps/desktop/dist/*.exe.blockmap
            apps/desktop/dist/latest.yml
            apps/desktop/dist/*.deb
            apps/desktop/dist/latest-linux.yml
          if-no-files-found: error
          retention-days: 7
      - if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: store-msix
          path: apps/desktop/dist/*.msix
          if-no-files-found: error
          # Long enough to upload to Partner Center after a release.
          retention-days: 30

  release:
    name: Publish the release
    needs: [check, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          pattern: installers-*
          path: installers
          merge-multiple: true
      # electron-updater on a Mac reads one `latest-mac.yml`, and picks the arm64 or x64 zip in it.
      - name: Merge the macOS update files
        working-directory: installers
        run: |
          yq '.files += load("latest-mac-arm64.yml").files' latest-mac-x86_64.yml > latest-mac.yml
          rm latest-mac-arm64.yml latest-mac-x86_64.yml
          cat latest-mac.yml
      - name: Write checksums
        working-directory: installers
        run: sha256sum -- * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.check.outputs.version }}
          PRERELEASE: ${{ needs.check.outputs.prerelease }}
        run: |
          # Re-running a tag (re-pushed or re-run) replaces its release; the tag itself stays.
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release delete "$TAG" --yes
          fi
          flags=()
          [[ "$PRERELEASE" == true ]] && flags+=(--prerelease)
          gh release create "$TAG" installers/* \
            --verify-tag --generate-notes --title "Spain Assist $VERSION" "${flags[@]}"
